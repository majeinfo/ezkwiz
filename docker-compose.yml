# Runs the whole app: MariaDB, Redis, and ezkwiz itself, wired together.
# For local development with `manage.py runserver` on the host instead, see
# docker-compose.dev.yml (MariaDB + Redis only).
#
# Set SECRET_KEY (and optionally DB_*/ALLOWED_HOSTS/DEBUG) in a .env file
# before running this -- see .env.example. BIND_HOST/BIND_PORT there control
# which local address/port the frontend listens on (e.g. BIND_HOST=127.0.0.1
# to keep it off the public network, behind a reverse proxy).
name: ezkwiz

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-quizz}
      MARIADB_USER: ${DB_USER:-quizz}
      MARIADB_PASSWORD: ${DB_PASSWORD:-quizz}
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ezkwiz:
    image: ghcr.io/majeinfo/ezkwiz:latest
    build: .
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in a .env file before running this compose file}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      BEHIND_HTTPS_PROXY: ${BEHIND_HTTPS_PROXY:-False}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_NAME: ${DB_NAME:-quizz}
      DB_USER: ${DB_USER:-quizz}
      DB_PASSWORD: ${DB_PASSWORD:-quizz}
      DB_HOST: mariadb
      DB_PORT: 3306
      REDIS_URL: redis://redis:6379/0
    ports:
      - "${BIND_HOST:-0.0.0.0}:${BIND_PORT:-8000}:8000"
    volumes:
      - media_data:/app/media

volumes:
  mariadb_data:
  media_data:
