# For local development and running the test suite: MariaDB + Redis only.
# `manage.py runserver` runs on the host and talks to these over the
# published ports below. For running the whole app in containers (including
# ezkwiz itself), see docker-compose.yml instead.
name: ezkwiz-dev

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: quizz
      MARIADB_USER: quizz
      MARIADB_PASSWORD: quizz
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb-init:/docker-entrypoint-initdb.d

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  mariadb_data:
