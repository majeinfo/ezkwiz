{% extends "base.html" %}
{% block title %}Delete quiz{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Delete "{{ object.title }}"?</h1>
<p>This will permanently delete the quiz, its questions, choices, and any game sessions.</p>
<form method="post">
  {% csrf_token %}
  <div class="d-flex gap-2">
    <button class="btn btn-danger" type="submit">Delete</button>
    <a class="btn btn-secondary" href="{% url 'quizzes:detail' object.pk %}">Cancel</a>
  </div>
</form>
{% endblock %}
